pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.shedaniel.me/" }
        maven { url "https://maven.neoforged.net/releases" }
        maven { url "https://files.minecraftforge.net/maven/" }
        gradlePluginPortal()
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == "architectury-plugin") {
                useModule("me.shedaniel:architectury-plugin:${requested.version}")
            }
            if (requested.id.id == "dev.architectury.loom") {
                useModule("dev.architectury:architectury-loom:${requested.version}")
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

include("common")
include("neoforge")

rootProject.name = "molten_metals-multiloader"
